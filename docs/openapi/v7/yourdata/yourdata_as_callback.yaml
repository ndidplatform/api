openapi: 3.0.3
info:
  title: Your Data API (Callback)
  description: |-
    API related to Your Data feature. API that AS MUST IMPLEMENT to be called by the platform.
  version: '7.0'
servers:
  - url: https://your-as-app-server
    description: Your AS application server

tags:
  - name: Your Data
    description: Everything related to Your Data programme.
    externalDocs:
      description: Find out more
      url: https://www.bot.or.th

paths:
  /yourdata/as/request/{service_id}:
    post:
      summary: Incoming data request from AS node to AS.
      description: >-
        (Callback) Incoming data request from AS node to AS. Note: Path is as provided when adding or updating service offered.
      operationId: as_receive_request
      parameters:
        - in: path
          name: service_id
          required: true
          schema:
            type: string
      requestBody:
        description: valid request from RP
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YourDataASRequest'

        required: true
      responses:
        '200':
          description: Respond with data or error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/YourDataASDataMessage'
                  - $ref: '#/components/schemas/YourDataASErrorMessage'
        '204':
          description: Acknowledged

  /yourdata/as/request_status_update:
    post:
      summary: Request (which pair of AS-RP node is involved) status update
      description: >-
        (Callback) Request (which pair of AS-RP node is involved) status update. Note: Path is as provided when setting callback.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YourDataRequestStatus'
        description: request status update
        required: true
      responses:
        '204':
          description: Status Update Acknowledged

components:
  schemas:
    YourDataASRequest:
      type: object
      required:
        - node_id
        - type
        - request_id
        - service_id
        - requester_node_id
        - namespace
        - identifier
        - request_params
        - authorization
        - request_time
        - request_timeout
      properties:
        node_id:
          type: string
          description: This node's ID
        type:
          type: string
          enum:
            - 'yourdata.data_request'
        request_id:
          type: string
        service_id:
          type: string
          description: >-
            service_id is a combination of {dataset_id} + {data_api}
            For example : "deposit_statment" means "/deposit/statement"
        service_version:
          type: string
          example: 'v1'
        service_extension:
          type: string
          example: '{permission: statement-detail}'
          description: >-
            Supplement property of this service.
            For YourData = service permission
        requester_node_id:
          type: string
          example: 'rp1'
          description: >-
            Requester's (RP's) node ID
        namespace:
          type: string
          example: 'citizen_id'
        identifier:
          type: string
          example: '1234567890123'
        request_params:
          type: string
        authorization:
          type: string
          description: >-
            JWT signed with AS node key.
            [Token payload schema](./yourdata_utility.yaml#/components/schemas/YourDataConsentTokenBody)
        request_time:
          type: integer
          example: 1533315873764
          description: >-
            Approximate request creation UNIX time stamp in milliseconds. Note
            that this is the timestamp generated by requester node.
        request_timeout:
          type: integer
          description: >-
            Timeout for the request. Unit in seconds.

    YourDataASDataMessage:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
        data:
          type: string
          description: "Data URI is supported for files e.g. 'data:application/pdf;base64,Z9msE6b26FZYHbOsifdkZw=='. When sending a file, using data URL with base64 encoding helps reduce MQ message payload size. Although data URL with base64 encoding like '   data:  application/pdf  ;  base64  ,   Z9msE6b26FZ   YHbOsifdkZw==   ' is parsable, it is not supported since having whitespaces will cause invalid data signature check"

    YourDataASErrorMessage:
      type: object
      required:
        - request_id
        - error_code
        - error_message
      properties:
        request_id:
          type: string
        error_code:
          type: integer
        error_message:
          type: string

    YourDataRequestStatus:
      oneOf:
        - type: object
          required:
            - type
            - requester_node_id
            - as_node_id
            - request_id
            - request_timeout
            - timed_out
            - status
          properties:
            node_id:
              type: string
              description: This node's ID
            type:
              type: string
              enum:
                - 'yourdata.request_status'
            requester_node_id:
              type: string
              description: Requester's (RP's) node ID
            as_node_id:
              type: string
              description: AS node ID
            request_id:
              type: string
              example: '54302ae9453ec0738133b393e329963efdb6b39f8136aa24606fec4cd4a1cb33'
            request_timeout:
              type: integer
              description: Timeout for the request. Unit in seconds.
            timed_out:
              type: boolean
              default: false
              # description: If timed_out is true and status = data_received, then RP may request for key to resume decryption
            status:
              type: string
              enum:
                - pending
                - data_decryption_pending
                - data_decryption_key_requested
                - data_decryption_key_available
                - completed
              description: >-
                'pending' means RP node sent request to AS node 
                'data_decryption_pending' means AS node sent encrypted data to RP node.
                'data_decryption_key_requested' means RP node received encrypted data and sent request for decryption key to AS node.
                'data_decryption_key_available' means AS node sent decryption key to RP node.
                'completed' means RP node is able to decrypt data from AS and the request is successful. This is request's terminal state.
                'errored' means AS node sent an error instead of data back to RP. This is request's terminal state.
        - type: object
          required:
            - type
            - requester_node_id
            - as_node_id
            - request_id
            - request_timeout
            - timed_out
            - status
            - error_code
            - error_message
          properties:
            node_id:
              type: string
              description: This node's ID
            type:
              type: string
              enum:
                - 'yourdata.request_status'
            requester_node_id:
              type: string
              description: Requester's (RP's) node ID
            as_node_id:
              type: string
              description: AS node ID
            request_id:
              type: string
              example: '54302ae9453ec0738133b393e329963efdb6b39f8136aa24606fec4cd4a1cb33'
            request_timeout:
              type: integer
              description: Timeout for the request. Unit in seconds.
            timed_out:
              type: boolean
              default: false
              # description: If timed_out is true and status = data_received, then RP may request for key to resume decryption
            status:
              type: string
              enum:
                - errored
              description: >-
                'pending' means RP node sent request to AS node 
                'data_decryption_pending' means AS node sent encrypted data to RP node.
                'data_decryption_key_requested' means RP node received encrypted data and sent request for decryption key to AS node.
                'data_decryption_key_available' means AS node sent decryption key to RP node.
                'completed' means RP node is able to decrypt data from AS and the request is successful. This is request's terminal state.
                'errored' means AS node sent an error instead of data back to RP. This is request's terminal state.
            error_code:
              type: integer
            error_message:
              type: string
