syntax = "proto3";

message MqProtocolMessage {
  int32  version           = 1;
  string msg_id            = 2;
  int32  seq_id            = 3;
  bytes  message           = 4;
  string sender_id         = 5;
  string receiver_id       = 6;
  string sender_proxy_id   = 7;
  string receiver_proxy_id = 8;
}
